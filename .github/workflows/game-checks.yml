name: Game checks
on:
  push:
    paths: ['monopoly/**', '.github/workflows/game-checks.yml']
  pull_request:
    paths: ['monopoly/**', '.github/workflows/game-checks.yml']
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check monopoly/app.js
      - run: node --test monopoly/tests/*.test.mjs monopoly/network.test.mjs
