name: Game checks
on:
  push:
    paths: ['monopoly/**', 'secret-hitler/**', '.github/workflows/game-checks.yml']
  pull_request:
    paths: ['monopoly/**', 'secret-hitler/**', '.github/workflows/game-checks.yml']
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: for file in monopoly/*.js secret-hitler/*.js; do node --check "$file" || exit 1; done
      - run: node --test monopoly/tests/*.test.mjs monopoly/network.test.mjs monopoly/ice-config.test.mjs
      - run: node --test secret-hitler/tests/*.test.mjs
      - name: Require configured TURN relay before release
        run: |
          node --input-type=module -e "import { getIceConfig } from './monopoly/ice-config.js'; getIceConfig({ requireRelay: true });"
